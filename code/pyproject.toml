[project]
name = "nfsm"
version = "0.1.0"
description = "Neural finite state machines: length-independent state tracking with a parallel scan."
readme = "README.md"
requires-python = ">=3.11,<3.13"

# The JAX backend is chosen by exactly one extra (mps / cuda / cpu).
dependencies = [
    "flax>=0.9",
    "optax>=0.2",
    "numpy>=1.26",
    "ml_dtypes>=0.3",
    "matplotlib>=3.8",
    "wandb>=0.17",
]

[project.optional-dependencies]
mps = ["jax-mps>=0.10"]          # Apple silicon (no float64)
cuda = ["jax[cuda12]>=0.4.34"]   # GPU cluster
cpu = ["jax>=0.4.34"]

[dependency-groups]
dev = ["ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfsm", "experiments"]

[tool.uv]
conflicts = [
    [{ extra = "mps" }, { extra = "cuda" }, { extra = "cpu" }],
]
